<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Matopeli</title>
<style>
  :root{
    --bg:#0b1020;
    --panel:#161f3d;
    --line:#26325c;
    --text:#e8ecf8;
    --muted:#95a0c4;
    --accent:#4cd4a0;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    min-height:100vh;
    background:radial-gradient(1200px 700px at 50% -10%, #1a2550 0%, var(--bg) 60%, #070a15 100%);
    color:var(--text);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    display:flex;flex-direction:column;align-items:center;
    padding:16px 16px 28px;
    overflow-x:hidden;
  }
  h1{
    margin:6px 0 2px;font-size:clamp(28px,7vw,44px);letter-spacing:.02em;
    background:linear-gradient(180deg,#fff,#8fe9c6);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .tagline{color:var(--muted);font-size:14px;margin:0 0 18px;text-align:center}
  .card{
    width:100%;max-width:560px;background:linear-gradient(180deg,rgba(28,38,74,.92),rgba(18,26,51,.92));
    border:1px solid var(--line);border-radius:18px;padding:20px;
    box-shadow:0 18px 50px rgba(0,0,0,.45);
  }
  label{display:block;font-size:13px;color:var(--muted);margin-bottom:8px;letter-spacing:.04em;text-transform:uppercase}
  input[type=text]{
    width:100%;padding:13px 14px;font-size:17px;border-radius:12px;
    border:1px solid var(--line);background:#0d1430;color:var(--text);outline:none;
  }
  input[type=text]:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(76,212,160,.16)}
  .hint{font-size:12px;color:var(--muted);margin-top:6px}
  .colors{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:6px}
  .swatch{
    aspect-ratio:1/1;border-radius:12px;border:2px solid transparent;cursor:pointer;
    position:relative;transition:transform .12s ease;
  }
  .swatch:hover{transform:translateY(-2px)}
  .swatch.sel{border-color:#fff;box-shadow:0 0 0 3px rgba(255,255,255,.18)}
  .swatch.sel::after{
    content:"";position:absolute;inset:0;margin:auto;width:11px;height:11px;border-radius:50%;
    background:rgba(255,255,255,.95);
  }
  .block{margin-top:20px}
  button{
    font:inherit;font-weight:650;cursor:pointer;border-radius:12px;padding:14px 20px;
    border:1px solid var(--line);background:#1b2546;color:var(--text);transition:filter .12s ease;
  }
  button:hover{filter:brightness(1.15)}
  button.primary{
    background:linear-gradient(180deg,#58e3ad,#2fae82);border-color:#2fae82;color:#06231a;
  }
  .btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}
  .qrwrap{
    margin-top:22px;padding-top:18px;border-top:1px solid var(--line);
    display:flex;gap:14px;align-items:center;
  }
  #qr{background:#fff;padding:8px;border-radius:10px;line-height:0;flex:0 0 auto}
  #qr img,#qr canvas{display:block}
  .qrtext{font-size:12px;color:var(--muted);word-break:break-all}
  .scores{display:flex;gap:10px;width:100%;max-width:560px;margin:0 0 12px}
  .score{
    flex:1;background:rgba(22,31,61,.85);border:1px solid var(--line);border-radius:14px;
    padding:10px 14px;text-align:center;
  }
  .score .k{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
  .score .v{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}
  #stage{position:relative;width:100%;max-width:560px;display:flex;justify-content:center}
  canvas{
    width:min(92vw,520px);height:min(92vw,520px);max-width:520px;
    border:1px solid var(--line);border-radius:14px;background:#0a1026;touch-action:none;
    box-shadow:0 14px 40px rgba(0,0,0,.45);
  }
  .overlay{
    position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:6px;background:rgba(8,12,26,.82);backdrop-filter:blur(3px);border-radius:14px;text-align:center;padding:20px;
  }
  .overlay h2{margin:0;font-size:28px}
  .overlay p{margin:0;color:var(--muted)}
  .big{font-size:42px;font-weight:800;color:var(--accent);font-variant-numeric:tabular-nums}
  .pad{display:none;margin-top:18px;gap:10px;grid-template-columns:repeat(3,72px);justify-content:center}
  .pad.on{display:grid}
  .pad button{width:72px;height:62px;font-size:24px;padding:0;background:#1b2546}
  .pad .sp{visibility:hidden}
  .keys{color:var(--muted);font-size:12.5px;margin-top:16px;text-align:center;max-width:560px;line-height:1.6}
  .hidden{display:none !important}
</style>
</head>
<body>

<h1>Matopeli</h1>
<p class="tagline">Kerää ruokaa, kasva pitkäksi &ndash; äläkä törmää.</p>

<!-- ALOITUSNÄKYMÄ -->
<section class="card" id="startCard">
  <div>
    <label for="nameInput">Madon nimi</label>
    <input id="nameInput" type="text" maxlength="12" autocomplete="off" placeholder="Esim. Pitkä Pena" value="Mato">
    <div class="hint">Enintään 12 merkkiä. Välilyönti on sallittu.</div>
  </div>

  <div class="block">
    <label>Madon väri</label>
    <div class="colors" id="colors"></div>
  </div>

  <div class="btns">
    <button class="primary" id="startBtn">Aloita peli</button>
  </div>

  <div class="qrwrap">
    <div id="qr"></div>
    <div>
      <div style="font-size:13px;color:var(--text);margin-bottom:4px;font-weight:600">Avaa puhelimella</div>
      <div class="qrtext" id="qrUrl"></div>
    </div>
  </div>
</section>

<!-- PELINÄKYMÄ -->
<div id="gameWrap" class="hidden" style="width:100%;display:flex;flex-direction:column;align-items:center">
  <div class="scores">
    <div class="score"><div class="k">Pisteet</div><div class="v" id="scoreV">0</div></div>
    <div class="score"><div class="k">Ennätys</div><div class="v" id="bestV">0</div></div>
  </div>

  <div id="stage">
    <canvas id="cv"></canvas>

    <div class="overlay hidden" id="pauseOv">
      <h2>Tauko</h2>
      <p>Jatka painamalla välilyöntiä</p>
      <button class="primary" id="resumeBtn" style="margin-top:12px">Jatka</button>
    </div>

    <div class="overlay hidden" id="overOv">
      <h2>Peli loppui</h2>
      <p id="overWho"></p>
      <div class="big" id="overScore">0</div>
      <p id="overBest"></p>
      <div class="btns" style="justify-content:center">
        <button class="primary" id="againBtn">Pelaa uudestaan</button>
        <button id="changeBtn">Vaihda mato</button>
      </div>
    </div>
  </div>

  <div class="pad" id="pad">
    <button class="sp"></button>
    <button data-dir="up" aria-label="Ylös">&#9650;</button>
    <button class="sp"></button>
    <button data-dir="left" aria-label="Vasemmalle">&#9664;</button>
    <button data-dir="down" aria-label="Alas">&#9660;</button>
    <button data-dir="right" aria-label="Oikealle">&#9654;</button>
  </div>

  <div class="keys">
    Ohjaus: nuolinäppäimet tai WASD &middot; Välilyönti = tauko &middot; Kosketusnäytöllä pyyhkäise tai käytä nuolia.
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
(function(){
  "use strict";

  /* ---------- Vakiot ---------- */
  var GRID = 21;
  var BASE_MS = 150;      // askelväli alussa
  var SPEEDUP = 5;        // nopeutuminen per ruoka (ms)
  var MIN_MS = 70;        // nopein askelväli
  var BEST_KEY = "matopeli.ennatys";

  var COLORS = [
    { name:"Vihreä",    hex:"#3ddc84" },
    { name:"Turkoosi",  hex:"#2ad4d4" },
    { name:"Sininen",   hex:"#4a8bff" },
    { name:"Violetti",  hex:"#9b6cff" },
    { name:"Pinkki",    hex:"#ff5fa2" },
    { name:"Punainen",  hex:"#ff5a4d" },
    { name:"Oranssi",   hex:"#ff9f1c" },
    { name:"Keltainen", hex:"#ffe066" },
    { name:"Lime",      hex:"#b8f52d" },
    { name:"Hopea",     hex:"#cdd6ea" }
  ];

  /* ---------- Apufunktiot ---------- */
  function hexToRgb(h){
    h = h.replace("#","");
    return { r:parseInt(h.slice(0,2),16), g:parseInt(h.slice(2,4),16), b:parseInt(h.slice(4,6),16) };
  }
  function mix(hex, target, t){
    var c = hexToRgb(hex);
    var r = Math.round(c.r + (target - c.r) * t);
    var g = Math.round(c.g + (target - c.g) * t);
    var b = Math.round(c.b + (target - c.b) * t);
    return "rgb(" + r + "," + g + "," + b + ")";
  }
  function lighten(hex, t){ return mix(hex, 255, t); }
  function darken(hex, t){ return mix(hex, 0, t); }
  function $(id){ return document.getElementById(id); }

  var isTouch = ("ontouchstart" in window) || (navigator.maxTouchPoints > 0);

  /* ---------- DOM ---------- */
  var startCard = $("startCard"), gameWrap = $("gameWrap");
  var nameInput = $("nameInput"), colorsEl = $("colors");
  var cv = $("cv"), ctx = cv.getContext("2d");
  var scoreV = $("scoreV"), bestV = $("bestV");
  var pauseOv = $("pauseOv"), overOv = $("overOv");
  var overWho = $("overWho"), overScore = $("overScore"), overBest = $("overBest");
  var pad = $("pad");

  /* ---------- Tila ---------- */
  var state = "start";   // start | playing | paused | over
  var snake = null, dir, nextDir, food, score = 0, stepMs = BASE_MS, acc = 0, lastT = 0, rafId = 0;
  var wormName = "Mato", wormColor = COLORS[0].hex, selColor = 0;
  var best = 0;
  try { best = parseInt(localStorage.getItem(BEST_KEY) || "0", 10) || 0; } catch(e){ best = 0; }
  bestV.textContent = best;

  /* ---------- Värivalitsin ---------- */
  COLORS.forEach(function(c, i){
    var b = document.createElement("div");
    b.className = "swatch" + (i === 0 ? " sel" : "");
    b.style.background = "linear-gradient(160deg," + lighten(c.hex,.25) + "," + c.hex + ")";
    b.title = c.name;
    b.setAttribute("role","button");
    b.setAttribute("aria-label", "Väri: " + c.name);
    b.addEventListener("click", function(){
      selColor = i; wormColor = c.hex;
      Array.prototype.forEach.call(colorsEl.children, function(el, j){
        el.classList.toggle("sel", j === i);
      });
    });
    colorsEl.appendChild(b);
  });

  /* ---------- QR-koodi ---------- */
  function initQR(){
    var url = window.location.href;
    var box = $("qr");
    $("qrUrl").textContent = url;
    if (typeof window.QRCode === "function") {
      try {
        new window.QRCode(box, {
          text: url, width:116, height:116,
          colorDark:"#0b1020", colorLight:"#ffffff",
          correctLevel: (window.QRCode.CorrectLevel ? window.QRCode.CorrectLevel.M : undefined)
        });
        return;
      } catch(e){ /* varajärjestely alla */ }
    }
    // Kirjasto ei latautunut: näytetään osoite pelkkänä tekstinä.
    box.style.display = "none";
    $("qrUrl").style.fontSize = "14px";
    $("qrUrl").style.color = "var(--text)";
  }

  /* ---------- Canvasin skaalaus (devicePixelRatio) ---------- */
  var cssSize = 0, cell = 0;
  function resize(){
    var rect = cv.getBoundingClientRect();
    cssSize = Math.max(120, Math.round(rect.width));
    var dpr = window.devicePixelRatio || 1;
    cv.width  = Math.round(cssSize * dpr);
    cv.height = Math.round(cssSize * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    cell = cssSize / GRID;
    draw();
  }
  window.addEventListener("resize", resize);
  window.addEventListener("orientationchange", function(){ setTimeout(resize, 150); });

  /* ---------- Pelilogiikka ---------- */
  function randFood(){
    var free = [];
    for (var y = 0; y < GRID; y++){
      for (var x = 0; x < GRID; x++){
        var hit = false;
        for (var i = 0; i < snake.length; i++){
          if (snake[i].x === x && snake[i].y === y){ hit = true; break; }
        }
        if (!hit) free.push({x:x, y:y});
      }
    }
    if (!free.length) return null;
    return free[Math.floor(Math.random() * free.length)];
  }

  function reset(){
    var mid = Math.floor(GRID / 2);
    snake = [{x:mid,y:mid},{x:mid-1,y:mid},{x:mid-2,y:mid}];
    dir = {x:1,y:0}; nextDir = {x:1,y:0};
    score = 0; stepMs = BASE_MS; acc = 0; lastT = 0;
    food = randFood();
    scoreV.textContent = "0";
    pauseOv.classList.add("hidden");
    overOv.classList.add("hidden");
  }

  function setDir(nx, ny){
    if (state !== "playing") return;
    if (nx === -dir.x && ny === -dir.y) return;   // ei käännöstä suoraan takaisin
    if (nx === dir.x && ny === dir.y) return;
    nextDir = {x:nx, y:ny};
  }

  function step(){
    dir = nextDir;
    var head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

    // Seinä
    if (head.x < 0 || head.y < 0 || head.x >= GRID || head.y >= GRID){ gameOver(); return; }

    var grows = !!(food && head.x === food.x && head.y === food.y);

    // Oma vartalo. Hännän viimeistä palaa ei lasketa törmäykseksi, koska se
    // siirtyy pois samalla askeleella - paitsi kun mato kasvaa eikä häntä liiku.
    var checkLen = grows ? snake.length : snake.length - 1;
    for (var i = 0; i < checkLen; i++){
      if (snake[i].x === head.x && snake[i].y === head.y){ gameOver(); return; }
    }

    snake.unshift(head);
    if (grows){
      score += 10;
      scoreV.textContent = score;
      stepMs = Math.max(MIN_MS, stepMs - SPEEDUP);
      food = randFood();
      if (!food){ gameOver(); return; }   // koko kenttä täynnä
    } else {
      snake.pop();
    }
  }

  function gameOver(){
    state = "over";
    var isRecord = score > best;
    if (isRecord){
      best = score;
      try { localStorage.setItem(BEST_KEY, String(best)); } catch(e){}
    }
    bestV.textContent = best;
    overWho.textContent = wormName + " pääsi tulokseen";
    overScore.textContent = score;
    overBest.textContent = (isRecord && score > 0) ? "Uusi ennätys!" : "Ennätys: " + best;
    overOv.classList.remove("hidden");
    draw();
  }

  /* ---------- Piirto ---------- */
  function roundRect(x, y, w, h, r){
    r = Math.min(r, w/2, h/2);
    ctx.beginPath();
    ctx.moveTo(x+r, y);
    ctx.arcTo(x+w, y,   x+w, y+h, r);
    ctx.arcTo(x+w, y+h, x,   y+h, r);
    ctx.arcTo(x,   y+h, x,   y,   r);
    ctx.arcTo(x,   y,   x+w, y,   r);
    ctx.closePath();
  }

  function drawTag(h){
    var label = wormName;
    if (!label) return;
    var fs = Math.max(8, Math.min(13, cell * 0.62));
    ctx.font = "600 " + fs.toFixed(1) + "px system-ui,-apple-system,Segoe UI,Roboto,sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    var tw = ctx.measureText(label).width;
    var bw = tw + fs * 0.9, bh = fs * 1.5;
    var cx = h.x * cell + cell/2;
    var by = h.y * cell - bh - cell*0.18;
    if (by < 2) by = h.y * cell + cell + cell*0.18;        // ei mahdu ylle -> alle
    if (by + bh > cssSize - 2) by = cssSize - bh - 2;
    var bx = cx - bw/2;
    if (bx < 2) bx = 2;
    if (bx + bw > cssSize - 2) bx = cssSize - bw - 2;

    ctx.fillStyle = "rgba(10,14,30,.88)";
    roundRect(bx, by, bw, bh, bh*0.35);
    ctx.fill();
    ctx.strokeStyle = lighten(wormColor, 0.25);
    ctx.lineWidth = 1;
    roundRect(bx+0.5, by+0.5, bw-1, bh-1, bh*0.35);
    ctx.stroke();
    ctx.fillStyle = "#ffffff";
    ctx.fillText(label, bx + bw/2, by + bh/2 + fs*0.04);
  }

  function draw(){
    if (!cell) return;
    var S = cssSize;

    ctx.fillStyle = "#0a1026";
    ctx.fillRect(0, 0, S, S);

    // Ruudukko
    ctx.strokeStyle = "rgba(255,255,255,.055)";
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (var i = 1; i < GRID; i++){
      var p = Math.round(i * cell) + 0.5;
      ctx.moveTo(p, 0); ctx.lineTo(p, S);
      ctx.moveTo(0, p); ctx.lineTo(S, p);
    }
    ctx.stroke();

    if (state === "start" || !snake) return;

    // Ruoka
    if (food){
      var fx = food.x * cell + cell/2, fy = food.y * cell + cell/2, r = cell * 0.32;
      ctx.beginPath(); ctx.arc(fx, fy, r, 0, Math.PI*2);
      ctx.fillStyle = "#ff5f6d"; ctx.fill();
      ctx.beginPath(); ctx.arc(fx - r*0.3, fy - r*0.35, r*0.3, 0, Math.PI*2);
      ctx.fillStyle = "rgba(255,255,255,.55)"; ctx.fill();
    }

    // Mato: häntä ensin, pää päällimmäiseksi
    var gap = Math.max(1, cell * 0.08);
    var rad = Math.min(6, cell * 0.28);
    for (var k = snake.length - 1; k >= 0; k--){
      var s = snake[k];
      var t = snake.length > 1 ? (k / (snake.length - 1)) : 0;
      ctx.fillStyle = (k === 0) ? lighten(wormColor, 0.45) : darken(wormColor, 0.10 + t * 0.30);
      roundRect(s.x*cell + gap, s.y*cell + gap, cell - gap*2, cell - gap*2, rad);
      ctx.fill();
    }

    // Silmät
    var h = snake[0];
    var hx = h.x*cell + cell/2, hy = h.y*cell + cell/2;
    var off = cell * 0.17, er = Math.max(1.2, cell * 0.075);
    var ex1, ey1, ex2, ey2;
    if (dir.x !== 0){ ex1 = hx + dir.x*off*0.8; ey1 = hy - off; ex2 = ex1; ey2 = hy + off; }
    else { ex1 = hx - off; ey1 = hy + dir.y*off*0.8; ex2 = hx + off; ey2 = ey1; }
    ctx.fillStyle = "#0b1020";
    ctx.beginPath(); ctx.arc(ex1, ey1, er, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(ex2, ey2, er, 0, Math.PI*2); ctx.fill();

    drawTag(h);
  }

  /* ---------- Silmukka ---------- */
  function loop(t){
    rafId = requestAnimationFrame(loop);
    if (state !== "playing"){ lastT = t; return; }
    if (!lastT) lastT = t;
    var dt = t - lastT; lastT = t;
    if (dt > 400) dt = 400;
    acc += dt;
    var moved = false;
    while (acc >= stepMs && state === "playing"){
      acc -= stepMs;
      step();
      moved = true;
    }
    if (moved) draw();
  }

  /* ---------- Näkymät ---------- */
  function startGame(){
    var n = nameInput.value.replace(/\s+/g, " ").trim().slice(0, 12);
    wormName = n || "Mato";
    wormColor = COLORS[selColor].hex;
    startCard.classList.add("hidden");
    gameWrap.classList.remove("hidden");
    if (isTouch) pad.classList.add("on");
    reset();
    state = "playing";
    lastT = 0;
    resize();          // asettaa mitat ja piirtää madon heti ensimmäiseen ruutuun
  }

  function playAgain(){
    reset();
    state = "playing";
    lastT = 0;
    draw();
  }

  function changeWorm(){
    state = "start";
    gameWrap.classList.add("hidden");
    startCard.classList.remove("hidden");
    overOv.classList.add("hidden");
    pauseOv.classList.add("hidden");
  }

  function togglePause(){
    if (state === "playing"){
      state = "paused";
      pauseOv.classList.remove("hidden");
    } else if (state === "paused"){
      state = "playing";
      lastT = 0;
      pauseOv.classList.add("hidden");
    }
  }

  /* ---------- Ohjaus ---------- */
  $("startBtn").addEventListener("click", startGame);
  $("againBtn").addEventListener("click", playAgain);
  $("changeBtn").addEventListener("click", changeWorm);
  $("resumeBtn").addEventListener("click", togglePause);

  nameInput.addEventListener("keydown", function(e){
    if (e.key === "Enter"){ e.preventDefault(); startGame(); }
    e.stopPropagation();   // välilyönti kuuluu nimikenttään, ei peliin
  });

  document.addEventListener("keydown", function(e){
    if (state === "start") return;
    switch (e.key){
      case "ArrowUp":    case "w": case "W": setDir(0,-1); e.preventDefault(); break;
      case "ArrowDown":  case "s": case "S": setDir(0, 1); e.preventDefault(); break;
      case "ArrowLeft":  case "a": case "A": setDir(-1,0); e.preventDefault(); break;
      case "ArrowRight": case "d": case "D": setDir(1, 0); e.preventDefault(); break;
      case " ": case "Spacebar":
        e.preventDefault();
        if (state === "over") playAgain(); else togglePause();
        break;
      case "Enter":
        if (state === "over"){ e.preventDefault(); playAgain(); }
        break;
    }
  });

  // Kosketusnäppäimistö
  var DIRMAP = { up:[0,-1], down:[0,1], left:[-1,0], right:[1,0] };
  Array.prototype.forEach.call(pad.querySelectorAll("button[data-dir]"), function(b){
    var d = DIRMAP[b.getAttribute("data-dir")];
    function go(ev){ ev.preventDefault(); setDir(d[0], d[1]); }
    b.addEventListener("touchstart", go, {passive:false});
    b.addEventListener("click", go);
  });

  // Pyyhkäisy
  var tx = 0, ty = 0, tracking = false;
  cv.addEventListener("touchstart", function(e){
    var t = e.changedTouches[0];
    tx = t.clientX; ty = t.clientY; tracking = true;
  }, {passive:true});
  cv.addEventListener("touchmove", function(e){ e.preventDefault(); }, {passive:false});
  cv.addEventListener("touchend", function(e){
    if (!tracking) return;
    tracking = false;
    var t = e.changedTouches[0];
    var dx = t.clientX - tx, dy = t.clientY - ty;
    if (Math.abs(dx) < 22 && Math.abs(dy) < 22){           // napautus
      if (state === "over") playAgain(); else togglePause();
      return;
    }
    if (Math.abs(dx) > Math.abs(dy)) setDir(dx > 0 ? 1 : -1, 0);
    else setDir(0, dy > 0 ? 1 : -1);
  }, {passive:true});

  /* ---------- Käynnistys ---------- */
  initQR();
  resize();
  rafId = requestAnimationFrame(loop);
})();
</script>
</body>
</html>
